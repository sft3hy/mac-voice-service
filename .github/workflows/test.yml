name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (torch CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt

      - name: Install system deps (phonemisation + MP3)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch CPU wheels only; the runner has no GPU. Other deps from PyPI.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r gateway/requirements.txt
          pip install pytest

      - name: Byte-compile sources
        run: python -m compileall -q gateway scripts tests

      - name: Run tests
        run: python -m pytest -q
